name: Release (auto-update)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      AI_CHARACTER_UPDATER_PUBKEY: ${{ vars.AI_CHARACTER_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Security baseline
        run: python3 tools/verify-security-baseline.py . || python tools/verify-security-baseline.py .
        shell: bash

      - name: Resolve build arguments
        id: build
        shell: bash
        run: |
          ARGS="--target ${{ matrix.target }}"
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY}" && -n "${AI_CHARACTER_UPDATER_PUBKEY}" ]]; then
            ARGS="${ARGS} --config src-tauri/tauri.updater.conf.json"
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret or AI_CHARACTER_UPDATER_PUBKEY variable is missing; building without auto-update artifacts."
            echo "updater=false" >> "$GITHUB_OUTPUT"
          fi
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: AI Character ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: "자동 업데이트용 서명 빌드입니다. 설치본은 앱 안에서 자동으로 이 릴리스를 확인합니다."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ steps.build.outputs.updater == 'true' }}
          args: ${{ steps.build.outputs.args }}
