name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Security baseline
        run: python tools/verify-security-baseline.py .

      - name: Build Windows installer (NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Package full Windows release
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package-windows-artifacts.ps1

      - name: Upload Windows installer and portable zip
        uses: actions/upload-artifact@v4
        with:
          name: ai-character-windows
          path: |
            release/windows/*.exe
            release/windows/*.zip
            release/windows/README.txt
          if-no-files-found: error

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "name=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: AI Character ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            release/windows/*.exe
            release/windows/*.zip
            release/windows/README.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
