<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>AI Character 설정</title>
<style>
  :root {
    --bg: #0e121b;
    --panel: #161b27;
    --panel-2: #1c2231;
    --field: #10141e;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.18);
    --hover: rgba(255, 255, 255, 0.05);
    --chip: rgba(255, 255, 255, 0.08);
    --text: #e9edf5;
    --text-2: #c9d1e0;
    --muted: #9aa5ba;
    --accent: #6c9cff;
    --accent-strong: #4f7fe6;
    --accent-soft: rgba(108, 156, 255, 0.14);
    --on-accent: #fff;
    --ok: #3fb87f;
    --ok-text: #8fe3b9;
    --ok-soft: rgba(63, 184, 127, 0.15);
    --warn: #e9a23b;
    --warn-text: #f5c987;
    --warn-soft: rgba(233, 162, 59, 0.14);
    --bad: #e06464;
    --bad-text: #f3a5a5;
    --bad-soft: rgba(224, 100, 100, 0.14);
    --toast: #232b40;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fa;
      --panel: #ffffff;
      --panel-2: #f7f9fc;
      --field: #ffffff;
      --line: rgba(15, 23, 42, 0.10);
      --line-strong: rgba(15, 23, 42, 0.22);
      --hover: rgba(15, 23, 42, 0.04);
      --chip: rgba(15, 23, 42, 0.06);
      --text: #172033;
      --text-2: #334155;
      --muted: #64708a;
      --accent: #3d6fe0;
      --accent-strong: #2f5fcf;
      --accent-soft: rgba(61, 111, 224, 0.10);
      --ok: #1f9d63;
      --ok-text: #157a4c;
      --ok-soft: rgba(31, 157, 99, 0.12);
      --warn: #c97d10;
      --warn-text: #94600c;
      --warn-soft: rgba(201, 125, 16, 0.12);
      --bad: #d04545;
      --bad-text: #b23434;
      --bad-soft: rgba(208, 69, 69, 0.10);
      --toast: #ffffff;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.14);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  code { background: var(--chip); padding: 1px 6px; border-radius: 6px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- layout ---------- */
  .layout { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 22px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #6c9cff, #b07cff); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; }
  .brand h1 { font-size: 16px; margin: 0; line-height: 1.3; }
  .version { color: var(--muted); font-size: 12px; margin: 0; }
  .overall { margin: 18px 6px 16px; padding: 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
  .overall-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 8px; }
  .overall-top strong { font-size: 13px; }
  .overall-bar { height: 6px; border-radius: 99px; background: var(--chip); overflow: hidden; }
  .overall-bar span { display: block; height: 100%; background: var(--ok); width: 0; transition: width .4s ease; }
  .overall small { color: var(--muted); font-size: 12px; }
  .nav-group { margin: 14px 6px 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
  nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 14px; }
  nav a:hover { background: var(--hover); }
  nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--chip); color: var(--text); flex: none; font-weight: 600; }
  nav a.active .dot { background: var(--accent); color: var(--on-accent); }
  nav a.done .dot { background: var(--ok); color: #fff; }
  nav a.skipped .dot { background: var(--line-strong); }
  .extra-nav { display: grid; gap: 2px; }
  .extra-nav .dot { background: transparent; font-size: 15px; }
  .save-state { margin: 18px 6px 0; font-size: 12px; color: var(--muted); }

  main { padding: 36px 48px 80px; max-width: 900px; width: 100%; }
  section[data-section] { display: none; animation: fade .25s ease; }
  section[data-section].visible { display: block; }
  section[data-section].still { animation: none; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ---------- typography & cards ---------- */
  .eyebrow { color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  h2 { font-size: 26px; margin: 4px 0 8px; line-height: 1.3; }
  .lead { color: var(--muted); margin: 0 0 24px; font-size: 15px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card h4 { margin: 16px 0 4px; font-size: 14px; color: var(--muted); }
  .card p { margin: 4px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .stack { display: grid; gap: 10px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row.space { justify-content: space-between; }
  .table-wrap { overflow-x: auto; }

  .badge { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; font-weight: 600; }
  .badge.ok { background: var(--ok-soft); color: var(--ok-text); }
  .badge.warn { background: var(--warn-soft); color: var(--warn-text); }
  .badge.bad { background: var(--bad-soft); color: var(--bad-text); }
  .badge.free { background: var(--accent-soft); color: var(--accent); }

  /* ---------- controls ---------- */
  button, .button { font: inherit; font-size: 14px; border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--text); padding: 8px 14px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; }
  button:hover, .button:hover { border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: progress; }
  button.primary, .button.primary { background: var(--accent-strong); border-color: transparent; color: var(--on-accent); font-weight: 600; }
  button.primary:hover, .button.primary:hover { background: var(--accent); }
  button.danger { color: var(--bad-text); }
  button.armed { background: var(--bad); border-color: transparent; color: #fff; }
  button.link { background: none; border: none; color: var(--muted); padding: 8px 6px; }
  button.link:hover { color: var(--text); }
  input[type=text], input[type=password], input[type=number], select { font: inherit; font-size: 14px; background: var(--field); color: var(--text); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 12px; min-width: 0; min-height: 38px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input.grow { flex: 1 1 260px; }
  input[type=number] { width: 120px; }
  textarea.code-box { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--field); color: var(--text); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 12px; width: 100%; resize: vertical; word-break: break-all; }
  .code-panel { border: 1px dashed var(--accent); border-radius: 12px; padding: 12px; }
  .short-code { font: 700 40px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 6px; color: var(--accent); user-select: all; }

  .toggle { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .toggle:first-child, h3 + .toggle { border-top: none; }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .switch { width: 44px; height: 26px; border-radius: 99px; background: var(--line-strong); position: relative; flex: none; transition: background .2s; margin-top: 1px; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
  .toggle input:checked + .switch { background: var(--ok); }
  .toggle input:checked + .switch::after { transform: translateX(18px); }
  .toggle input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toggle.danger input:checked + .switch { background: var(--bad); }
  .toggle strong { display: block; font-size: 14.5px; }
  .toggle span.desc { color: var(--muted); font-size: 13px; }
  .field { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--line); }
  .field strong { display: block; font-size: 14.5px; }
  .field .desc { color: var(--muted); font-size: 13px; }

  .key-row { padding: 14px 0; border-top: 1px solid var(--line); }
  .key-row:first-child, h3 + .key-row, summary + .key-row { border-top: none; }
  .key-row h4 { margin: 0; font-size: 15px; color: var(--text); }

  /* numbered steps (guides, sign-up steps, "who does what") */
  .steps { counter-reset: step; list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .steps > li { counter-increment: step; position: relative; padding: 2px 0 12px 40px; }
  .steps > li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 700; }
  .steps > li.done::before { content: "✓"; background: var(--ok); color: #fff; }
  .steps > li h4 { margin: 2px 0 4px; font-size: 15px; color: var(--text); }
  .steps > li p { margin: 4px 0 0; color: var(--text-2); }
  .steps ol { margin: 6px 0 10px; padding-left: 18px; color: var(--text-2); font-size: 14px; }

  .quick { display: grid; gap: 12px; }
  .quick-step { display: grid; grid-template-columns: 32px 1fr; gap: 14px; align-items: start; padding: 16px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
  .quick-step .num { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .quick-step.done { border-color: var(--ok-soft); }
  .quick-step.done .num { background: var(--ok); color: #fff; }
  .quick-step h4 { margin: 3px 0 4px; font-size: 15.5px; color: var(--text); }
  .quick-step p { margin: 0 0 10px; }

  .footer-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .notice { border-radius: 12px; padding: 12px 14px; font-size: 14px; margin: 0 0 14px; background: var(--accent-soft); border: 1px solid var(--accent-soft); }
  .notice.warn { background: var(--warn-soft); border-color: var(--warn-soft); }
  .notice.ok { background: var(--ok-soft); border-color: var(--ok-soft); }
  .notice.bad { background: var(--bad-soft); border-color: var(--bad-soft); }
  #fatal { display: none; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast { position: fixed; right: 24px; bottom: 24px; max-width: min(420px, calc(100vw - 32px)); display: grid; gap: 8px; z-index: 10; }
  .toast { background: var(--toast); color: var(--text); border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 12px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 14px; animation: fade .2s ease; }
  .toast.ok { border-left-color: var(--ok); }
  .toast.bad { border-left-color: var(--bad); }
  .offline { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; gap: 10px; align-items: center; justify-content: center; padding: 10px 16px; background: #5a3d12; color: #ffe2b0; font-size: 14px; box-shadow: var(--shadow); }
  .offline[hidden] { display: none; }

  /* ---------- tables ---------- */
  .using { width: 100%; border-collapse: collapse; font-size: 14px; }
  .using th, .using td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  .using th { color: var(--muted); font-weight: 600; font-size: 12.5px; border-top: none; }
  .using td:first-child { white-space: nowrap; font-weight: 600; }
  .using .what { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .using.data td:first-child { font-weight: 500; }
  .using.data td { padding: 7px 8px; font-size: 13px; }

  /* ---------- guides & help ---------- */
  details > summary { cursor: pointer; }
  .guide summary, details.card > summary { font-weight: 600; font-size: 15px; }
  .guide[open] summary, details.card[open] > summary { margin-bottom: 12px; }
  .tip { margin: 6px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 13px; color: var(--text-2); }
  .faq { border-top: 1px solid var(--line); padding: 10px 0; }
  .faq summary { font-size: 14px; }
  .faq p { margin: 8px 0 0; color: var(--text-2); }
  .glossary { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 12px 0 0; font-size: 14px; }
  .glossary dt { font-weight: 600; }
  .glossary dd { margin: 0; color: var(--text-2); }
  .explain { margin: 0 0 14px; }
  .explain summary { color: var(--accent); font-size: 14px; }
  .explain ul { margin: 8px 0 0; padding-left: 18px; color: var(--text-2); font-size: 14px; }
  .explain li + li { margin-top: 4px; }

  /* ---------- stats & charts ---------- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
  .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .stat-label { color: var(--muted); font-size: 12.5px; }
  .stat-value { font-size: 20px; font-weight: 700; margin: 2px 0; overflow-wrap: anywhere; }
  .stat-sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .meter { margin: 10px 0 14px; }
  .meter-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 6px; }
  .meter-row b.ok { color: var(--ok-text); } .meter-row b.warn { color: var(--warn-text); } .meter-row b.bad { color: var(--bad-text); }
  .meter-track { height: 10px; border-radius: 99px; background: var(--chip); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
  .meter-fill.ok { background: var(--ok); } .meter-fill.warn { background: var(--warn); } .meter-fill.bad { background: var(--bad); }
  .period { margin: -8px 0 18px; }
  .chart { margin: 14px 0 6px; }
  .chart-title { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-bottom: 20px; position: relative; }
  .bars.dense { gap: 2px; }
  .bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; position: relative; min-width: 0; }
  .bar-fill { background: var(--accent); border-radius: 4px 4px 0 0; min-height: 0; }
  .bar:hover .bar-fill { filter: brightness(1.2); }
  .bar-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* ---------- small screens ---------- */
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 16px; }
    .overall { margin: 12px 0; }
    nav ol, .extra-nav { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .save-state { display: none; }
    main { padding: 22px 16px 60px; }
    .card { padding: 16px; }
    .field { flex-wrap: wrap; }
    .glossary { grid-template-columns: 1fr; }
    .glossary dd { margin-bottom: 8px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">
      <div class="brand-mark">A</div>
      <div><h1>AI Character 설정</h1><p class="version" id="version">불러오는 중…</p></div>
    </div>
    <div class="overall">
      <div class="overall-top"><strong>설정 진행</strong><small id="overall-text">0 / 8 단계</small></div>
      <div class="overall-bar"><span id="overall-fill"></span></div>
    </div>
    <div class="nav-group">꼭 필요한 설정</div>
    <nav aria-label="필수 설정"><ol id="nav"></ol></nav>
    <div class="nav-group">필요할 때만</div>
    <nav aria-label="선택 설정"><ol id="nav-more"></ol></nav>
    <div class="nav-group">도구</div>
    <nav class="extra-nav" aria-label="도구">
      <a href="#local" id="nav-local"><span class="dot">💻</span>내 컴퓨터 AI</a>
      <a href="#remote" id="nav-remote"><span class="dot">🌐</span>다른 컴퓨터 AI</a>
      <a href="#usage" id="nav-usage"><span class="dot">📊</span>사용량</a>
      <a href="#help" id="nav-help"><span class="dot">❓</span>사용 설명서</a>
    </nav>
    <p class="save-state" id="save-state">각 화면의 저장 버튼을 누르면 앱에 바로 반영됩니다.</p>
  </aside>
  <main id="main">
    <div class="notice warn" id="fatal" role="alert"></div>
  </main>
  <div class="offline" id="offline" hidden><span class="spinner"></span> AI Character 앱과 연결이 끊겼습니다 — 앱이 켜지면 자동으로 다시 연결합니다.</div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
