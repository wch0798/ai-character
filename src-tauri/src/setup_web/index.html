<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Character 처음 설정</title>
<style>
  :root {
    --bg: #0d111c;
    --panel: #151b2b;
    --panel-2: #1b2235;
    --line: rgba(255, 255, 255, 0.08);
    --text: #e8ecf4;
    --muted: #9aa5ba;
    --accent: #6c9cff;
    --accent-2: #4f7fe6;
    --ok: #4cc38a;
    --warn: #f0aa46;
    --bad: #e06464;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  code { background: rgba(255,255,255,0.07); padding: 1px 6px; border-radius: 6px; }

  .layout { display: grid; grid-template-columns: 270px 1fr; min-height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 26px 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #6c9cff, #b07cff); display: grid; place-items: center; font-weight: 800; }
  .brand h1 { font-size: 16px; margin: 0; }
  .version { color: var(--muted); font-size: 12px; margin: 0 0 18px 44px; }
  .overall { margin: 0 4px 18px; }
  .overall-bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .overall-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), #7be0b0); width: 0; transition: width .4s ease; }
  .overall small { color: var(--muted); font-size: 12px; }
  nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 14px; }
  nav a:hover { background: rgba(255,255,255,0.04); }
  nav a.active { background: rgba(108,156,255,0.14); }
  nav .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: rgba(255,255,255,0.08); flex: none; }
  nav a.active .dot { background: var(--accent); color: #fff; }
  nav a.done .dot { background: var(--ok); color: #fff; }
  nav a.skipped .dot { background: rgba(255,255,255,0.18); }
  .extra-nav { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 12px 0; }
  .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .stat-label { color: var(--muted); font-size: 12.5px; }
  .stat-value { font-size: 20px; font-weight: 700; margin: 2px 0; }
  .stat-sub { color: var(--muted); font-size: 12px; }
  .meter { margin: 10px 0 14px; }
  .meter-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 6px; }
  .meter-row b.ok { color: #8fe3b9; } .meter-row b.warn { color: #f5c987; } .meter-row b.bad { color: #f0a0a0; }
  .meter-track { height: 10px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
  .meter-fill.ok { background: var(--ok); } .meter-fill.warn { background: var(--warn); } .meter-fill.bad { background: var(--bad); }
  .notice.bad { background: rgba(224,100,100,0.1); border-color: rgba(224,100,100,0.3); }
  .period { margin: -8px 0 18px; }
  .chart { margin: 14px 0 6px; }
  .chart-title { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-bottom: 20px; position: relative; }
  .bars.dense { gap: 2px; }
  .bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; position: relative; min-width: 0; }
  .bar-fill { background: linear-gradient(180deg, #8fb3ff, var(--accent)); border-radius: 4px 4px 0 0; min-height: 0; }
  .bar:hover .bar-fill { filter: brightness(1.25); }
  .bar-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .card h4 { margin: 16px 0 4px; font-size: 14px; color: var(--muted); }
  .table-wrap { overflow-x: auto; }
  .using.data td:first-child { font-weight: 500; }
  .using.data td { padding: 7px 8px; font-size: 13px; }
  .save-state { margin-top: 18px; font-size: 12px; color: var(--muted); padding: 0 6px; }

  main { padding: 36px 48px 80px; max-width: 920px; }
  section[data-section] { display: none; animation: fade .25s ease; }
  section[data-section].visible { display: block; }
  section[data-section].still { animation: none; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .eyebrow { color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  h2 { font-size: 26px; margin: 4px 0 8px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card p { margin: 4px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .status-card { display: flex; gap: 12px; align-items: flex-start; }
  .status-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; font-size: 16px; background: rgba(255,255,255,0.06); }
  .status-card[data-tone="ok"] .status-icon { background: rgba(76,195,138,0.18); color: var(--ok); }
  .status-card[data-tone="warn"] .status-icon { background: rgba(240,170,70,0.16); color: var(--warn); }

  .badge { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 99px; background: rgba(255,255,255,0.08); color: var(--muted); white-space: nowrap; }
  .badge.ok { background: rgba(76,195,138,0.16); color: #8fe3b9; }
  .badge.warn { background: rgba(240,170,70,0.16); color: #f5c987; }
  .badge.bad { background: rgba(224,100,100,0.16); color: #f0a0a0; }
  .badge.free { background: rgba(108,156,255,0.16); color: #a9c3ff; }

  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row.space { justify-content: space-between; }
  .stack { display: grid; gap: 10px; }
  button, .button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: 8px 14px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, .button:hover { border-color: rgba(255,255,255,0.2); }
  button:disabled { opacity: .5; cursor: progress; }
  button.primary, .button.primary { background: var(--accent-2); border-color: transparent; color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent); }
  button.danger { color: #f0a0a0; }
  button.armed { background: var(--bad); color: #fff; }
  button.link { background: none; border: none; color: var(--muted); padding: 8px 6px; }
  input[type=text], input[type=password], input[type=number], select { font: inherit; font-size: 14px; background: #0f1422; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0; }
  input:focus, select:focus { outline: 2px solid rgba(108,156,255,0.5); outline-offset: 1px; }
  input.grow { flex: 1 1 260px; }
  input[type=number] { width: 120px; }
  textarea.code-box { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0f1422; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; width: 100%; box-sizing: border-box; resize: vertical; word-break: break-all; }
  textarea.code-box:focus { outline: 2px solid rgba(108,156,255,0.5); outline-offset: 1px; }
  .code-panel { border: 1px dashed rgba(108,156,255,0.5); border-radius: 12px; padding: 12px; }
  .short-code { font: 700 40px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 6px; color: var(--accent); user-select: all; }

  .toggle { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .toggle:first-of-type { border-top: none; }
  .toggle input { display: none; }
  .switch { width: 42px; height: 24px; border-radius: 99px; background: rgba(255,255,255,0.14); position: relative; flex: none; transition: background .2s; margin-top: 2px; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .toggle input:checked + .switch { background: var(--ok); }
  .toggle input:checked + .switch::after { transform: translateX(18px); }
  .toggle.danger input:checked + .switch { background: var(--bad); }
  .toggle strong { display: block; font-size: 14.5px; }
  .toggle span.desc { color: var(--muted); font-size: 13px; }
  .field { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
  .field strong { display: block; font-size: 14.5px; }
  .field .desc { color: var(--muted); font-size: 13px; }

  .key-row { padding: 14px 0; border-top: 1px solid var(--line); }
  .key-row:first-child { border-top: none; padding-top: 0; }
  .key-row h4 { margin: 0; font-size: 15px; }

  .steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .steps > li { counter-increment: s; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 14px 54px; position: relative; }
  .steps > li::before { content: counter(s); position: absolute; left: 16px; top: 14px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.1); font-size: 13px; font-weight: 700; }
  .steps > li.done::before { content: "✓"; background: var(--ok); color: #fff; }
  .steps > li h4 { margin: 0 0 4px; font-size: 15px; }
  .steps ol { margin: 6px 0 10px; padding-left: 18px; color: #cfd6e4; font-size: 14px; }

  .footer-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
  .notice { border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; background: rgba(108,156,255,0.1); border: 1px solid rgba(108,156,255,0.25); }
  .notice.warn { background: rgba(240,170,70,0.1); border-color: rgba(240,170,70,0.3); }
  .notice.ok { background: rgba(76,195,138,0.1); border-color: rgba(76,195,138,0.3); }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast { position: fixed; right: 24px; bottom: 24px; max-width: 420px; display: grid; gap: 8px; z-index: 10; }
  .toast { background: #222b42; border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 12px 14px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); font-size: 14px; animation: fade .2s ease; }
  .toast.ok { border-left-color: var(--ok); }
  .toast.bad { border-left-color: var(--bad); }
  #fatal { display: none; }
  .offline { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; gap: 10px; align-items: center; justify-content: center; padding: 10px 16px; background: #5a3d12; color: #ffe2b0; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .offline[hidden] { display: none; }
  .using { width: 100%; border-collapse: collapse; font-size: 14px; }
  .using th, .using td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  .using th { color: var(--muted); font-weight: 600; font-size: 12.5px; border-top: none; }
  .using td:first-child { white-space: nowrap; font-weight: 600; }
  .using .what { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .quick { display: grid; gap: 12px; }
  .quick-step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
  .quick-step .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); font-weight: 700; }
  .quick-step.done .num { background: var(--ok); color: #fff; }
  .quick-step h4 { margin: 2px 0 6px; font-size: 15px; }
  .guide summary, details.card > summary { cursor: pointer; font-weight: 600; font-size: 15px; }
  .guide[open] summary { margin-bottom: 10px; }
  .steps { counter-reset: step; list-style: none; margin: 0; padding: 0; }
  .steps > li { counter-increment: step; position: relative; padding: 2px 0 12px 40px; }
  .steps > li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; }
  .steps > li p { margin: 4px 0 0; color: #cfd6e4; }
  .tip { margin: 6px 0 0; padding: 10px 12px; border-radius: 10px; background: rgba(108,156,255,0.08); font-size: 13px; color: #cfd6e4; }
  .faq { border-top: 1px solid var(--line); padding: 10px 0; }
  .faq summary { cursor: pointer; font-size: 14px; }
  .faq p { margin: 8px 0 0; color: #cfd6e4; }
  .glossary { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 12px 0 0; font-size: 14px; }
  .glossary dt { font-weight: 600; }
  .glossary dd { margin: 0; color: #cfd6e4; }
  .explain { margin: 0 0 14px; }
  .explain summary { cursor: pointer; color: var(--accent); font-size: 14px; }
  .explain ul { margin: 8px 0 0; padding-left: 18px; color: #cfd6e4; font-size: 14px; }
  .explain li + li { margin-top: 4px; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; }
    main { padding: 24px 18px 60px; }
    .grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand"><div class="brand-mark">A</div><h1>AI Character 설정</h1></div>
    <p class="version" id="version">불러오는 중…</p>
    <div class="overall">
      <div class="overall-bar"><span id="overall-fill"></span></div>
      <small id="overall-text">0 / 8 단계</small>
    </div>
    <nav><ol id="nav"></ol></nav>
    <nav class="extra-nav"><a href="#local" id="nav-local"><span class="dot">💻</span>내 컴퓨터 AI (설치형)</a><a href="#remote" id="nav-remote"><span class="dot">🌐</span>다른 컴퓨터 AI (원격)</a><a href="#usage" id="nav-usage"><span class="dot">📊</span>사용량 보기</a><a href="#help" id="nav-help"><span class="dot">❓</span>사용 설명서</a></nav>
    <p class="save-state" id="save-state">변경 내용은 각 단계의 저장 버튼을 누르면 앱에 바로 저장됩니다.</p>
  </aside>
  <main id="main">
    <div class="notice warn" id="fatal"></div>
  </main>
  <div class="offline" id="offline" hidden><span class="spinner"></span> AI Character 앱과 연결이 끊겼습니다 — 앱이 켜지면 자동으로 다시 연결합니다.</div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
