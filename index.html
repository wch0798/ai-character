<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AI Character</title>

  <script src="/live2d/core/live2dcubismcore.min.js"></script>
</head>

<body>

<div id="app">

  <canvas id="live2d-canvas"></canvas>

  <!-- 채팅 -->
  <div id="chat-panel">

    <div
      id="chat-resize-handle"
      title="채팅창 크기 조절"
    ></div>

    <div id="chat-history-toolbar">
      <button
        id="chat-history-button"
        type="button"
        title="대화 목록"
      >
        대화
      </button>

      <button
        id="new-chat-button"
        type="button"
        title="새 채팅"
      >
        + 새 채팅
      </button>
    </div>

    <div id="chat-history-drawer">
      <div id="chat-history-drawer-header">
        <div id="chat-history-drawer-title">대화</div>

        <button
          id="chat-history-close"
          type="button"
          aria-label="대화 목록 닫기"
        >×</button>
      </div>

      <input
        id="chat-history-search"
        type="search"
        placeholder="대화 검색"
        aria-label="대화 검색"
      />

      <div id="chat-history-list"></div>

      <div id="chat-history-backup-actions">
        <button id="chat-history-export-all" type="button">
          전체 내보내기
        </button>
        <button id="chat-history-import" type="button">
          가져오기
        </button>
      </div>

      <button
        id="chat-history-delete-all"
        type="button"
      >
        전체 채팅 삭제
      </button>
    </div>

    <div id="messages"></div>

    <div
      id="attachment-list"
      aria-label="첨부 파일"
    ></div>

    <form id="chat-form">

      <button
        id="attachment-button"
        type="button"
        title="파일 첨부"
        aria-label="파일 첨부"
      >
        +
      </button>

      <input
        id="chat-input"
        type="text"
        autocomplete="off"
        placeholder="무엇이든 물어보세요"
      />

      <button type="submit">
        전송
      </button>

    </form>

  </div>

  <!-- 우클릭 메뉴는 main.ts 에서 단일 패널로 생성 -->

  <div id="performance-hud">
    FPS -- · CPU -- · RAM --
  </div>

  <div id="status">
    Live2D 시작 중...
  </div>

</div>

<script
  type="module"
  src="/src/main.ts"
></script>

</body>
</html>
