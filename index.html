<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta name="color-scheme" content="only light" />

  <title>AI Character</title>

  <script src="/live2d/core/live2dcubismcore.min.js"></script>
</head>

<body>

<div id="app">

  <canvas id="live2d-canvas"></canvas>
  <!-- 보이는 캐릭터 몸에만 맞춤. 창 사각형이 아님 -->
  <div id="character-hit-layer" aria-hidden="true"></div>
  <div id="chat-resize-capture" aria-hidden="true"></div>

  <!-- 채팅 -->
  <div id="chat-panel">

    <div
      id="chat-resize-n"
      class="chat-resize-handle chat-resize-n"
      data-resize="n"
      title="위로 크기 조절"
    ></div>
    <div
      id="chat-resize-ne"
      class="chat-resize-handle chat-resize-ne"
      data-resize="ne"
      title="위로 크기 조절"
    ></div>
    <div
      id="chat-resize-handle"
      class="chat-resize-handle chat-resize-s"
      data-resize="s"
      title="높이 조절"
    ></div>
    <div
      id="chat-resize-e"
      class="chat-resize-handle chat-resize-e"
      data-resize="e"
      title="너비 조절"
    ></div>
    <div
      id="chat-resize-se"
      class="chat-resize-handle chat-resize-se"
      data-resize="se"
      title="크기 조절"
    ></div>

    <div id="chat-history-toolbar">
      <div class="chat-toolbar-start">
        <button
          id="chat-history-button"
          type="button"
          title="대화 목록"
        >
          대화
        </button>

        <button
          id="new-chat-button"
          type="button"
          title="새 채팅"
        >
          새 채팅
        </button>
      </div>

      <div class="chat-toolbar-end">
        <button
          id="usage-dashboard-button"
          type="button"
          title="사용량"
          aria-label="사용량"
          data-icon="📊"
        >
          <span class="toolbar-label">사용량</span>
        </button>
        <button
          id="chat-close-button"
          type="button"
          title="채팅 닫기"
          aria-label="채팅 닫기"
        >
          ×
        </button>
      </div>
    </div>

    <div id="chat-limit-notice" hidden></div>

    <div id="usage-dashboard-panel" hidden>
      <div class="usage-dashboard-header">
        <div class="usage-dashboard-title">오늘 사용량</div>
        <button type="button" id="usage-dashboard-login">로그인</button>
        <button type="button" id="usage-dashboard-web">자세히 (웹)</button>
        <button type="button" id="usage-dashboard-refresh">새로고침</button>
        <button type="button" id="usage-dashboard-close" aria-label="사용량 닫기">×</button>
      </div>
      <div id="usage-dashboard-body">불러오는 중…</div>
    </div>

    <div id="chat-history-drawer">
      <div id="chat-history-drawer-header">
        <div id="chat-history-drawer-title">대화</div>

        <button
          id="chat-history-close"
          type="button"
          aria-label="대화 목록 닫기"
        >×</button>
      </div>

      <input
        id="chat-history-search"
        type="search"
        placeholder="대화 검색"
        aria-label="대화 검색"
      />

      <div id="chat-history-list"></div>

      <div id="chat-history-backup-actions">
        <button id="chat-history-export-all" type="button">
          전체 내보내기
        </button>
        <button id="chat-history-import" type="button">
          가져오기
        </button>
      </div>

      <button
        id="chat-history-delete-all"
        type="button"
      >
        전체 채팅 삭제
      </button>
    </div>

    <div id="messages"></div>

    <div
      id="attachment-list"
      aria-label="첨부 파일"
    ></div>

    <form id="chat-form">

      <button
        id="attachment-button"
        type="button"
        title="파일 첨부"
        aria-label="파일 첨부"
      >
        +
      </button>

      <textarea
        id="chat-input"
        rows="1"
        autocomplete="off"
        spellcheck="false"
        placeholder="무엇이든 물어보세요 (Shift+Enter 줄바꿈)"
      ></textarea>

      <button type="submit">
        전송
      </button>

    </form>

  </div>

  <!-- 우클릭 메뉴는 main.ts 에서 단일 패널로 생성 -->

  <div id="performance-hud">
    FPS -- · CPU -- · RAM --
  </div>

  <div id="status" class="hidden">
    Live2D 시작 중...
  </div>

</div>

<script
  type="module"
  src="/src/main.ts"
></script>

</body>
</html>
